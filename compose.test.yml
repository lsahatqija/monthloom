name: monthloom-tests

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monthloom_test
      POSTGRES_PASSWORD: monthloom_test
      POSTGRES_DB: monthloom_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monthloom_test -d monthloom_test']
      interval: 1s
      timeout: 5s
      retries: 30
