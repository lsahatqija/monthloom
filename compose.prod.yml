name: monthloom-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infrastructure/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    logging: *default-logging
    healthcheck:
      # Probe Caddy's local admin API. Use IPv4 explicitly because Alpine may resolve localhost
      # to ::1 while Caddy's admin listener is bound to 127.0.0.1.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:2019/config/ >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: lsahatqija/monthloom:web-${IMAGE_TAG:?Set IMAGE_TAG in .env.production}
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
    expose:
      - '3000'
    networks:
      - frontend
    logging: *default-logging
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: lsahatqija/monthloom:api-${IMAGE_TAG:?Set IMAGE_TAG in .env.production}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_PUBLIC_URL: https://${DOMAIN}
      WEB_PUBLIC_URL: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.production}
      SESSION_DURATION_HOURS: ${SESSION_DURATION_HOURS:-168}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-monthloom_session}
      SESSION_COOKIE_SECURE: 'true'
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-5242880}
      UPLOAD_ALLOWED_MIME_TYPES: ${UPLOAD_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Monthloom}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS in .env.production}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
      AUTH_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:-15}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
      PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES:-30}
      PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS: ${PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS:-5}
      EMAIL_VERIFICATION_RATE_LIMIT_WINDOW_MINUTES: ${EMAIL_VERIFICATION_RATE_LIMIT_WINDOW_MINUTES:-60}
      EMAIL_VERIFICATION_RATE_LIMIT_MAX_REQUESTS: ${EMAIL_VERIFICATION_RATE_LIMIT_MAX_REQUESTS:-10}
      TRUSTED_PROXY_HOPS: 1
    expose:
      - '4000'
    volumes:
      - uploads_data:/app/uploads
    networks:
      - frontend
      - backend
    logging: *default-logging
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
