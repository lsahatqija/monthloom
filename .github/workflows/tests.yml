name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monthloom_test
          POSTGRES_PASSWORD: monthloom_test
          POSTGRES_DB: monthloom_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U monthloom_test -d monthloom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://monthloom_test:monthloom_test@127.0.0.1:55432/monthloom_test
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:ci
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: warn
          retention-days: 14
