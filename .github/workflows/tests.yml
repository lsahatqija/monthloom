name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monthloom_test
          POSTGRES_PASSWORD: monthloom_test
          POSTGRES_DB: monthloom_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U monthloom_test -d monthloom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://monthloom_test:monthloom_test@127.0.0.1:55432/monthloom_test
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:ci
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: warn
          retention-days: 14

  patch-notes:
    name: Publish wiki and patch notes
    needs: tests
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: monthloom-wiki
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the tested source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the GitHub wiki
        id: wiki
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki

      - name: Publish documentation and patch notes
        if: steps.wiki.outcome == 'success'
        uses: ./.github/actions/publish-wiki
        with:
          wiki-path: .wiki
          before-sha: ${{ github.event.before }}
          after-sha: ${{ github.sha }}
          repository: ${{ github.repository }}
          server-url: ${{ github.server_url }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          verification-result: ${{ needs.tests.result }}
          pushed-at: ${{ github.event.head_commit.timestamp }}

      - name: Explain missing wiki setup
        if: steps.wiki.outcome != 'success'
        run: |
          echo "::warning title=GitHub wiki is not initialized::Enable Wikis and create the first Home page, then rerun this workflow. See docs/github-wiki.md."
