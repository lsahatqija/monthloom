name: Publish Docker images

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Publish Docker Hub images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: docker-hub-main
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      COMPOSE_FILE: compose.yml:compose.publish.yml
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build API and web images with Compose
        run: docker compose build --pull api web
      - name: Push commit images
        run: docker compose push api web
      - name: Tag and push latest images
        run: |
          docker tag "lsahatqija/monthloom:api-${IMAGE_TAG}" lsahatqija/monthloom:api-latest
          docker tag "lsahatqija/monthloom:web-${IMAGE_TAG}" lsahatqija/monthloom:web-latest
          IMAGE_TAG=latest docker compose push api web
