:root[data-theme=&quot;light&quot;] {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

  --color-text-primary: var(
    --foreground,

h3,

#widget {

.card {

  corner-shape: var(--corner-shape);

#ml-preview{padding:20px 0;display:flex;justify-content:center}
#ml-phone{--ml-bg:#F7F5EF;--ml-surface:#FFFEFA;--ml-a:#C9DCCF;--ml-b:#F0D4BF;--ml-c:#DDD7E9;--ml-action:#35675B;--ml-text:#293C36;color:var(--ml-text);background:var(--ml-bg);font:14px/1.45 system-ui,sans-serif;width:min(100%,390px);height:730px;display:flex;flex-direction:column;border:1px solid color-mix(in srgb,var(--ml-text) 18%,var(--ml-bg));border-radius:28px;overflow:hidden;position:relative;box-shadow:0 15px 40px #00000012;color-scheme:light}
