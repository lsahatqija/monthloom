name: monthloom

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-template}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-template}
      POSTGRES_DB: ${POSTGRES_DB:-template_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-template} -d ${POSTGRES_DB:-template_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_PUBLIC_URL: http://localhost:4000
      WEB_PUBLIC_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-template}:${POSTGRES_PASSWORD:-template}@postgres:5432/${POSTGRES_DB:-template_dev}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-development-secret-please}
      SESSION_COOKIE_SECURE: 'false'
      UPLOAD_DIR: /app/uploads
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Monthloom}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@monthloom.local}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
      AUTH_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:-15}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
      PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES:-30}
      PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS: ${PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS:-5}
      EMAIL_VERIFICATION_RATE_LIMIT_WINDOW_MINUTES: ${EMAIL_VERIFICATION_RATE_LIMIT_WINDOW_MINUTES:-60}
      EMAIL_VERIFICATION_RATE_LIMIT_MAX_REQUESTS: ${EMAIL_VERIFICATION_RATE_LIMIT_MAX_REQUESTS:-10}
    ports:
      - '4000:4000'
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  uploads_data:
